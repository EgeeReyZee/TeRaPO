name: CI - Build and Test BLAS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libopenblas-dev \
            python3 \
            python3-pip

      - name: Build GEMM
        run: |
          cd gemm
          make

      - name: Build interface tests
        run: |
          cd tests
          make

      - name: Run interface tests
        run: |
          cd tests
          for test in test_gemv test_ger test_geru_gerc test_hemv test_her test_her2 \
                      test_symv test_syr test_syr2 test_trmv test_trsv; do
            echo "=== Running $test ==="
            ./$test
          done

      - name: Run performance tests (GEMM)
        run: |
          cd gemm
          ./a.exe || ./a.out