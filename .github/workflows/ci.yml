name: CI - Build and Test BLAS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenblas-dev

      - name: Build GEMM benchmark
        run: |
          cd gemm
          make

      - name: Build interface tests
        run: |
          cd tests
          make

      - name: Run interface tests
        run: |
          cd tests
          for f in test_gemv test_ger test_geru_gerc test_hemv test_her \
                   test_her2 test_symv test_syr test_syr2 test_trmv test_trsv; do
            echo "--- $f ---"
            ./$f
          done

      - name: Run performance test (GEMM benchmark)
        run: |
          cd gemm
          ./gemm_benchmark